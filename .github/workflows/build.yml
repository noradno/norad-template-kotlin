name: Build Gradle project

on:
  push:

jobs:
  build-gradle-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Run build with Gradle Wrapper
        run: ./gradlew build
